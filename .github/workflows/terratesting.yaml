on:
  workflow_call:
    inputs:
      tests_overall_timeout:
        required: false
        type: string
        default: 40m
      test_project_number:
        required: false
        type: string
        default: 912137435662
      test_project_id:
        required: false
        type: string
        default: tf-test-env-2381
      test_code_folder:
        type: string
        required: true
      test_run_arg:
        type: string
        required: false
        default: "Test*"
        description: "Regex expression. By default runs all tests which names start with Test"
      workload_identity_pool_id:
        type: string
        required: false
        default: gh-actions-terratest
      run_e2e:
        type: boolean
        required: false
        default: false
        description: "When true, export RUN_E2E=1 and E2E_PROJECT_ID and run the opt-in E2E test (module must gate its TestE2E on RUN_E2E)."

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    name: Terratest testing
    runs-on: ubuntu-latest
    concurrency:
      group: terratest-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - id: "gcp-auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: projects/${{ inputs.test_project_number }}/locations/global/workloadIdentityPools/${{ inputs.workload_identity_pool_id }}/providers/github
          service_account: tf-admin-sa@${{ inputs.test_project_id }}.iam.gserviceaccount.com
      - id: "validate-project"
        name: "Validate test project id"
        run: |
          case "${{ inputs.test_project_id }}" in
            tf-test-env-2381) echo "test project allowlisted" ;;
            *) echo "::error::test_project_id '${{ inputs.test_project_id }}' is not allowlisted"; exit 1 ;;
          esac
      - id: "prep-testing"
        name: "Prepare golang environment"
        run: |
          cd ${{ inputs.test_code_folder }}/
          # Do NOT run `go mod tidy` here: it reverts the pinned grpc/x/oauth2
          # versions when the tests don't import them directly. `go test` runs
          # with -mod=readonly, so the committed go.mod/go.sum must be complete.
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; echo "::error::gofmt required on files above"; exit 1; fi
      - id: "configure-git"
        name: "Configure git to use PAT"
        run: |
          git config --global url."https://oauth2:${{ secrets.READ_MAP_TF_MODULES }}@github.com/Mattilsynet".insteadOf "https://github.com/Mattilsynet"
      - id: "run-tests"
        name: "Run tests"
        env:
          RUN_E2E: ${{ inputs.run_e2e && '1' || '' }}
          E2E_PROJECT_ID: ${{ inputs.run_e2e && inputs.test_project_id || '' }}
        run: |
          cd ${{ inputs.test_code_folder }}/
          go test -v -run ${{ inputs.test_run_arg }} -timeout ${{ inputs.tests_overall_timeout }}

      - id: "clean-git"
        name: "Clean git config"
        run: |
          git config --global --unset url.https://oauth2:${{ secrets.READ_MAP_TF_MODULES }}@github.com/Mattilsynet.insteadof
